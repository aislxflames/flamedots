# -----------------------------------------------------
# Key bindings
# name: "Default"
# -----------------------------------------------------

# ────────────────────────────
# → Mod Key Declaration
# ────────────────────────────
$mainMod = SUPER
# SUPER + g toggles overview on current monitor
bind = $mainMod, g, hyprexpo:expo,toggle
# bind = $mainMod, h, hyprexpo:expo,select

# ────────────────────────────
# → Application Launchers
# ────────────────────────────
bind = $mainMod, T, exec, $terminal                     # Launch terminal
bind = $mainMod, E, exec, $fileManager                  # Launch file manager
bind = $mainMod, A, exec, $launcher                     # Launch main app launcher
bind = ALT, SPACE, exec, $launcher                      # Launch main app launcher
bind = $mainMod+Alt, A, exec, $launcherswitcher         # Launch alternate launcher
bind = $mainMod, F4, exec, $powermenu                   # Launch power menu
bind = $mainMod+Alt, F4, exec, $powermenuswitcher       # Launch alternate power menu
bind = $mainMod+Shift, R, exec, $system                 # Launch system app
bind = $mainMod, I, exec, $settings                     # Launch settings
bind = $mainMod, L, exec, $lockscreen                   # Lock screen
bind = $mainMod+Shift, E, exec, $terminal -e yazi       # Launch Yazi in terminal
bind = $mainMod, B, exec, $toggle_waybar                # Toggle Waybar
bind = $mainMod+Shift, P, exec, hyprpicker              # Launch Color picker
bind = $mainMod, F, exec, $focus

# ────────────────────────────
# → Window Management
# ────────────────────────────
bind = $mainMod, Q, killactive,                         # Close active window
bind = $mainMod, F8, exit,                              # Exit Hyprland
bind = $mainMod, W, togglefloating,                     # Toggle floating mode
bind = $mainMod, P, pseudo,                             # Toggle pseudo split (dwindle)
bind = $mainMod, J, togglesplit,                        # Toggle split layout (dwindle)
bind = ALT + SHIFT, RETURN, fullscreen                  # Toggle fullscreen
bind = ALT, RETURN , exec,hyprctl dispatch fullscreen 1

bind = $mainMod SHIFT, right, layoutmsg, movewindowto r
bind = $mainMod SHIFT, left, layoutmsg, movewindowto l
bind = $mainMod SHIFT, up, layoutmsg, movewindowto u
bind = $mainMod SHIFT, down, layoutmsg, movewindowto d

# ────────────────────────────
# → Focus Movement
# ────────────────────────────
bind = $mainMod, left, movefocus, l                     # Focus left
bind = $mainMod, right, movefocus, r                    # Focus right
bind = $mainMod, up, movefocus, u                       # Focus up
bind = $mainMod, down, movefocus, d                     # Focus down

# ────────────────────────────
# → Workspaces
# ────────────────────────────
# Switch to workspace
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# ────────────────────────────
# → Special Workspace (Scratchpad)
# ────────────────────────────
bind = $mainMod, S, togglespecialworkspace, magic       # Toggle scratchpad
bind = $mainMod SHIFT, S, movetoworkspace, special:magic # Move window to scratchpad

# ────────────────────────────
# → Scroll to switch workspaces
# ────────────────────────────
bind = $mainMod, mouse_down, workspace, e+1             # Next workspace (scroll down)
bind = $mainMod, mouse_up, workspace, e-1               # Previous workspace (scroll up)

# ────────────────────────────
# → Window Movement/Resize with Mouse
# ────────────────────────────
bindm = $mainMod, mouse:272, movewindow                 # Drag to move window
bindm = $mainMod, mouse:273, resizewindow               # Drag to resize window
bindm = $mainMod, Z, movewindow                         # Keyboard move window
bindm = $mainMod, X, resizewindow                       # Keyboard resize window

# ────────────────────────────
# → Relative Workspace Switching
# ────────────────────────────
bind = $mainMod+Ctrl, Right, workspace, r+1             # Next workspace
bind = $mainMod+Ctrl, Left, workspace, r-1              # Previous workspace

# ────────────────────────────
# → Move Window to Relative Workspace
# ────────────────────────────
bind = $mainMod+Ctrl+Shift, Right, movetoworkspace, r+1 # Move window to next workspace
bind = $mainMod+Ctrl+Shift, Left, movetoworkspace, r-1  # Move window to previous workspace

# ────────────────────────────
# → Clipboard and Screenshot
# ────────────────────────────
bind = $mainMod, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy # Clipboard history
bind = , Print, exec, $screenshot                           # Screenshot

# ────────────────────────────
# → Themes and Appearance
# ────────────────────────────
bind = $mainMod SHIFT, W, exec, $wallpaper                  # Set wallpaper/colorscheme
bind = $mainMod SHIFT, T, exec, $themeswitcher              # Switch theme



# ────────────────────────────
# → Multimedia Keys (wpctl/playerctl)
# ────────────────────────────

# ────────────────────────────
# → Volume and Brightness (Custom Scripts)
# ────────────────────────────
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume +5
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume -5
bindl = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle

bindel = , F11, exec, swayosd-client --output-volume +5
bindel = , F10, exec, swayosd-client --output-volume -5
bindl = ,  F9, exec, swayosd-client --output-volume mute-toggle


# Brightness controls
bindel = , XF86MonBrightnessUp, exec, swayosd-client --brightness +10
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness -10

# Media controls
bindl = , F12, exec, swayosd-client --playerctl play-pause
bindl = , XF86AudioPlay, exec, swayosd-client --playerctl play-pause
bindl = , XF86AudioNext, exec, swayosd-client --playerctl next
bindl = , XF86AudioPrev, exec, swayosd-client --playerctl previous

# Key Toggles
bind = , CAPS_LOCK, exec, bash -c 'sleep 0.2 && swayosd-client --caps-lock'
bind = , NUM_LOCK, exec, bash -c 'sleep 0.2 && swayosd-client --num-lock'
bind = , SCROLL_LOCK, exec, bash -c 'sleep 0.2 && swayosd-client --scroll-lock'

# ────────────────────────────
# → Utilities and Scripts
# ────────────────────────────
bind = $mainMod,period, exec, rofi -show emoji                     # Emoji picker
bind = $mainMod, F1, exec, ~/.config/flames/scripts/keybinds.sh    # Show keybinds
bind = $mainMod+Shift, F, exec, ~/.config/waybar/switcher.sh       # Waybar switcher


