exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 &
exec-once = $system &
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = ~/.config/flames/scripts/battery-charging.sh
exec-once = $dock
exec-once = hyprshell run &
exec-once = hypridle &
exec-once = swayosd-server &
exec-once = kdeconnectd &
exec-once = hyprpm reload -n
exec-once = flatpak override --filesystem=~/.themes:ro --filesystem=~/.icons:ro --user
# exec-once = hyprctl dispatch workspace 5
exec-once = hyprctl setcursor Yuurei-Angel 24
