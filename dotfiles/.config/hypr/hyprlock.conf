source = ~/.config/hypr/conf/colors.conf

# BACKGROUND
background {
    monitor =
    path = ~/.config/flames/current.png
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# INPUT FIELD
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = $inactive
    font_color = $active2
    fade_on_empty = false
    font_family = SF Pro Display Bold
    placeholder_text = <i>Hi, $USER</i>
    hide_input = false
    position = 0, -290
    halign = center
    valign = center
}

# Hour-Time
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%I")"
    color = $active2
    font_size = 140
    font_family = AlfaSlabOne 
    position = 0, 280
    halign = center
    valign = center
}

# Minute-Time
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%M")"
    color = $inactive
    font_size = 140
    font_family = AlfaSlabOne
    position = 0, 100
    halign = center
    valign = center
}

# Day-Date-Month
label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%A, %d %B')"
    color = $active2
    font_size = 30
    font_family = SF Pro Display Bold
    position = 0, -80
    halign = center
    valign = center
}

# CURRENT SONG
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/scripts/songdetail.sh)" 
    color = $active2
    font_size = 18
    font_family = JetBrains Mono Nerd, SF Pro Display Bold
    position = 0, 60
    halign = center
    valign = bottom
}
